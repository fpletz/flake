[audio]
enable_sounds = false

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.79999998211860657
    end = [
        "media",
        "notifications",
        "clipboard",
        "bar_2",
        "bar",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "tray",
        "session"
    ]
    margin_ends = 0
    start = [
        "launcher",
        "active-workspace",
        "ribbon",
        "bar_3",
        "mirror",
        "power_profile",
        "cat_2",
        "temp",
        "network_rx",
        "network_tx",
        "sysmon",
        "privacy"
    ]

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.bpletza]
    color = "primary"
    name = "bpletza"
    path = "/home/fpletz/.calendar/bpletza"
    type = "vdir"

    [calendar.account.feiertage_bayern]
    color = "primary"
    name = "feiertage_bayern"
    path = "/home/fpletz/.calendar/feiertage_bayern"
    type = "vdir"

[config]

[control_center.calendar]
show_week_numbers = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 120.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
address = "Ortenburg, Germany"

[lockscreen]
transition = [ "wipe" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ ]

[plugin_settings."mindnbytes/nix-status"]
flake_dir = "/home/fpletz/src/flake"

[plugin_settings."rylos/syncthing"]
config_path = "/home/fpletz/.config/syncthing/config.xml"

[plugins]
enabled = [
    "noctalia/kaomoji",
    "raycursive/niri-displays",
    "ayagmar/obs-control",
    "rylos/syncthing",
    "rylos/tailnet",
    "dunarand/tmux-provider",
    "elijaharch/wl-screen-mirror",
    "yocraft/qrcode",
    "salemsayed/niri-active-workspace",
    "luochen1990/niri-ribbon",
    "zhangdm-520/niri-media-idle",
    "dotnetrob/cat"
]

[shell]
avatar_path = "/home/fpletz/.face"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_show_advanced = true
settings_window_translucent = true

    [shell.launcher]
    pinned = [ "librewolf", "chromium-browser" ]

    [shell.panel]
    launcher_compact = true

    [shell.screen_corners]
    enabled = true

[templates]

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Moon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "niri", "qt" ]
    community_ids = [ "claude-code", "ungoogled-chromium", "zed", "steam", "fuzzel", "obs", "thunderbird", "zathura", "bat", "yazi" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition = [ "wipe" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

[widget.active-workspace]
type = "salemsayed/niri-active-workspace:active-workspace"

[widget.bar]
show_count = false
type = "rylos/tailnet:bar"

[widget.bar_2]
type = "rylos/syncthing:bar"

[widget.bar_3]
type = "raycursive/niri-displays:bar"

[widget.cat]
input_devices = [ "/dev/input/by-id/usb-Keychron*", "/dev/input/by-id/usb-Winry315*" ]
type = "noctalia/bongocat:cat"

[widget.cat_2]
type = "dotnetrob/cat:cat"

[widget.clock]
format = "{:%a %d %b} {:%H:%M}"

[widget.date]
vertical_format = "{:%a\\n%d}"

[widget.media]
max_length = 400

[widget.mirror]
type = "elijaharch/wl-screen-mirror:mirror"

[widget.privacy]
hide_inactive = true

[widget.ribbon]
type = "luochen1990/niri-ribbon:ribbon"

[widget.sysmon]
stat = "disk_used_pct"
